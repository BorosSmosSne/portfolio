<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Enterprise management dashboard preview">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3E7EC"/>
      <stop offset="1" stop-color="#CDD5DE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g2)"/>
  <!-- dashboard card -->
  <g transform="translate(150 90)">
    <rect x="0" y="0" width="500" height="320" rx="16" fill="#FFFFFF" stroke="#ECECEC" stroke-width="2"/>
    <rect x="24" y="24" width="160" height="16" rx="8" fill="#1A1A1A"/>
    <rect x="24" y="52" width="100" height="12" rx="6" fill="#CDD5DE"/>
    <!-- bar chart -->
    <g transform="translate(24 210)">
      <rect x="0" y="-60" width="40" height="60" rx="6" fill="#C7D0DA"/>
      <rect x="56" y="-100" width="40" height="100" rx="6" fill="#7C9885"/>
      <rect x="112" y="-80" width="40" height="80" rx="6" fill="#C7D0DA"/>
      <rect x="168" y="-130" width="40" height="130" rx="6" fill="#7C9885"/>
      <rect x="224" y="-90" width="40" height="90" rx="6" fill="#C7D0DA"/>
    </g>
    <!-- side stats -->
    <g transform="translate(330 90)">
      <rect x="0" y="0" width="146" height="40" rx="10" fill="#EEF2EF"/>
      <rect x="0" y="56" width="146" height="40" rx="10" fill="#EEF2EF"/>
      <rect x="0" y="112" width="146" height="40" rx="10" fill="#EEF2EF"/>
      <circle cx="24" cy="20" r="8" fill="#7C9885"/>
      <circle cx="24" cy="76" r="8" fill="#7C9885"/>
      <circle cx="24" cy="132" r="8" fill="#7C9885"/>
    </g>
  </g>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="150" y="450" fill="#4B4B4B" font-size="18">C# · Python · Node.js · MongoDB</text>
  </g>
</svg>
